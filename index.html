<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DevPath: khóa học Backend & Fullstack</title>
  <meta name="description" content="Khóa học tự học trở thành Backend & Fullstack Engineer: 14 chương, bài học chi tiết có quiz, lab CI/CD, Cloud, Kubernetes, System Design và dự án thật.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%234f3ff0'/><path d='M8 11l5 5-5 5M16 21h8' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <script>
    try { var t = localStorage.getItem('devpath-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <a class="skip" href="#main">Bỏ qua tới nội dung</a>

  <header class="header">
    <button class="icon-btn menu-btn" id="menuBtn" aria-label="Mở menu" aria-expanded="false" aria-controls="rail">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <a href="#/" class="brand" aria-label="DevPath, trang chủ">
      <span class="brand-mark" aria-hidden="true">&gt;_</span>
      <span class="brand-name">DevPath</span>
    </a>
    <button class="search-trigger" id="searchBtn" aria-label="Tìm kiếm bài học (Ctrl+K)">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2" fill="none"/><path d="M20 20l-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span>Tìm kiếm bài học, lab, chủ đề…</span><kbd>Ctrl K</kbd>
    </button>
    <div class="header-actions">
      <a class="progress-pill" href="#/progress" aria-label="Xem tiến độ học">
        <span class="pill-ring" id="pillRing" aria-hidden="true"></span>
        <span><span class="pill-label">Tiến độ</span> <strong data-overall>0%</strong></span>
      </a>
      <button class="icon-btn" id="themeBtn" aria-label="Đổi giao diện sáng/tối">
        <svg class="i-sun" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="12" cy="12" r="4" fill="currentColor"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <svg class="i-moon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" fill="currentColor"/></svg>
      </button>
    </div>
  </header>

  <nav class="rail" id="rail" aria-label="Điều hướng chính">
    <a href="#/" data-nav="home"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z" fill="currentColor"/></svg><span>Trang chủ</span></a>
    <a href="#/roadmap" data-nav="roadmap"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M5 4h10l4 4v12H5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M8 12h8M8 16h6M8 8h4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span>Lộ trình</span></a>
    <a href="#/labs" data-nav="labs"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 1.7 3h10.6a2 2 0 0 0 1.7-3l-5-9V3" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg><span>Labs</span></a>
    <a href="#/projects" data-nav="projects"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 7h16v12H4zM9 7V5h6v2" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg><span>Dự án</span></a>
    <a href="#/career" data-nav="career"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M12 3l2.5 5 5.5.8-4 3.9 1 5.5-5-2.7-5 2.7 1-5.5-4-3.9 5.5-.8z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg><span>Sự nghiệp</span></a>
    <a href="#/progress" data-nav="progress"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span>Tiến độ</span></a>
  </nav>
  <div class="scrim" id="scrim" hidden></div>

  <main id="main" class="main" tabindex="-1"></main>

  <div class="palette" id="palette" role="dialog" aria-modal="true" aria-label="Tìm kiếm" hidden>
    <div class="palette-box">
      <div class="palette-input">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2" fill="none"/><path d="M20 20l-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <input id="paletteInput" type="search" placeholder="Tìm bài học, lab: docker, jwt, kafka, canary…" autocomplete="off" aria-label="Từ khoá tìm kiếm" aria-controls="paletteResults">
        <kbd>Esc</kbd>
      </div>
      <ul class="palette-results" id="paletteResults" role="listbox"></ul>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/dockerfile.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/nginx.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/groovy.min.js" defer></script>
  <script src="assets/js/data/phases.js" defer></script>
  <script src="assets/js/data/labs.js" defer></script>
  <script src="assets/js/data/projects.js" defer></script>
  <script src="assets/js/app.js" defer></script>
</body>
</html>
